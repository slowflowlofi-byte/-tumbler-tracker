function readNativeGenetics(){ try { const a=JSON.parse(localStorage.getItem('tt_genetics')||'[]'); return Array.isArray(a)?a:[]; } catch(e){ return []; } }
function allGenetics(){
  let custom=readNativeGenetics();
  try{ const local=JSON.parse(localStorage.getItem('tumbler_custom_genetics')||'[]'); if(Array.isArray(local)) custom=[...custom,...local]; }catch(e){}
  return [...new Set([...BASE_GENETICS,...custom,...(Array.isArray(window.__seedFinderNames)?window.__seedFinderNames:[])].map(x=>String(x).trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base',numeric:true}));
}
function rememberGenetic(name){
  name=String(name||'').trim(); if(!name) return;
  let arr=readNativeGenetics();
  if(!arr.some(x=>String(x).toLowerCase()===name.toLowerCase())) arr.push(name);
  window.__nativeGenetics=arr;
  try{localStorage.setItem('tumbler_custom_genetics',JSON.stringify(arr));}catch(e){}
  nativeRememberGenetic(name);
}

const DATA = {
  genetics:"", trimQuality:4, initialTrim:0, tumbles:[], kiefQuality:4, leftover:0
};
const $=s=>document.querySelector(s);
function stars(n){
 let s=''; for(let i=1;i<=5;i++){ const full=n>=i, half=!full && n>=i-.5; s+=`<span class="star ${full?'on':''}" style="position:relative">★</span>`; if(half) s=s.replace('style="position:relative"','style="position:relative;background:linear-gradient(90deg,#f6f7f8 50%,#74777c 50%);-webkit-background-clip:text;background-clip:text;color:transparent"'); }
 return s;
}
function interactiveRating(id,value){
 let s=`<div class="star-rating" id="${id}">`;
 for(let i=1;i<=5;i++){
   s+=`<button type="button" class="star-pick" aria-label="${i} estrellas"><span class="glyph">★</span>${value>=i?'<span class="glyph fill-left">★</span><span class="glyph fill-right">★</span>':value>=i-.5?'<span class="glyph fill-left">★</span>':''}<span class="half left" onclick="setRating('${id}',${i}-.5)"></span><span class="half right" onclick="setRating('${id}',${i})"></span></button>`;
 }
 s+=`<span class="rating-value">${value.toFixed(1).replace('.0','')} / 5</span></div>`; return s;
}
function setRating(id,value){
 value=Math.max(.5,Math.min(5,Math.round(value*2)/2));
 const el=document.getElementById(id); if(!el)return;
 el.dataset.value=value;
 const buttons=el.querySelectorAll('.star-pick');
 buttons.forEach((b,idx)=>{
   const i=idx+1;
   b.innerHTML=`<span class="glyph">★</span>${value>=i?'<span class="glyph fill-left">★</span><span class="glyph fill-right">★</span>':value>=i-.5?'<span class="glyph fill-left">★</span>':''}<span class="half left" onclick="setRating('${id}',${i}-.5)"></span><span class="half right" onclick="setRating('${id}',${i})"></span>`;
 });
 const rv=el.querySelector('.rating-value'); if(rv)rv.textContent=`${value.toFixed(1).replace('.0','')} / 5`;
 if(id==='trimRating') DATA.trimQuality=value;
 if(id==='kiefRating') DATA.kiefQuality=value;
}
function geneticOptions(selected){
 return allGenetics().filter(g=>g.toLowerCase().includes(String(selected||'').toLowerCase()));
}
function geneticIcon(name){
 const n=String(name||'').toLowerCase();
 const related=[[/blue|berry|blueberry/,'🔵'],[/grape|uva/,'🍇'],[/papaya|tropicanna|tropaya|mango|peach|fruit|orange|citrus/,'🍊'],[/banana/,'🍌'],[/honey/,'🍯'],[/oreo|cookie|biscotti|cake|cream|candy|donut/,'🍪'],[/gas|diesel|fuel/,'⛽'],[/ice|frost|snow|frozen/,'❄️'],[/lemon|lime|acid/,'🍋'],[/cherry/,'🍒'],[/apple/,'🍎'],[/mint|mints/,'🌿'],[/rose|floral|flower/,'🌸'],[/kush|og/,'🌲'],[/haze/,'🌫️'],[/24k|gold/,'🪙'],[/moroccan|morocco/,'🏜️'],[/star|cosmic|space/,'⭐'],[/magic/,'✨'],[/zangria|sangria/,'🍹']];
 for(const [re,ico] of related) if(re.test(n)) return ico;
 const pool=['💎','🧬','🪴','🔮','🌙','☄️','🧪','🌀','🧿','⚡','🧊','🌴','🍬','🫐','🥭','🍍','🥝','🌺','🌌','🪐'];
 let hash=0; for(let i=0;i<n.length;i++) hash=(hash*31+n.charCodeAt(i))>>>0; return pool[hash%pool.length];
}
function escapeHtml(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function renderGenSuggestions(query=''){
 const box=$('#genSuggestions'); if(!box)return;
 const raw=String(query||'').trim(); const q=raw.toLowerCase();
 const all=allGenetics(); const matches=all.filter(g=>!q||g.toLowerCase().includes(q)).slice(0,12);
 let html=matches.map(g=>`<button type="button" class="gen-suggestion" data-gen="${encodeURIComponent(g)}" onclick="chooseGen(decodeURIComponent(this.dataset.gen))"><span class="gen-icon">${geneticIcon(g)}</span><span class="gen-name">${escapeHtml(g)}<br><small>Toca para seleccionar</small></span><span class="gen-check">›</span></button>`).join('');
 if(raw && !all.some(g=>g.toLowerCase()===q)) html+=`<button type="button" class="gen-suggestion custom" data-gen="${encodeURIComponent(raw)}" onclick="chooseGen(decodeURIComponent(this.dataset.gen))"><span class="gen-icon">＋</span><span class="gen-name"><b>Usar “${escapeHtml(raw)}”</b><br><small>Añadir a tus genéticas futuras</small></span><span class="gen-check">›</span></button>`;
 if(!html) html='<div class="gen-empty">Escribe el nombre de la genética.</div>';
 box.innerHTML=html; box.classList.remove('hidden');
}
function chooseGen(value){
 value=String(value||'').trim(); if(!value)return;
 const input=$('#gen'); if(!input)return;
 input.value=value; input.dataset.selected=value; DATA.genetics=value; rememberGenetic(value);
 const box=$('#genSuggestions'); if(box)box.classList.add('hidden');
 const clear=$('#genClear'); if(clear)clear.style.display='block';
 const selected=$('#selectedGenetic'); if(selected){selected.innerHTML=`<span class="check">✓</span><span><b>${escapeHtml(value)}</b><br><span class="muted">Genética seleccionada</span></span>`;selected.classList.remove('hidden');}
 input.blur();
 const rating=$('#trimRating'); if(rating)setTimeout(()=>rating.scrollIntoView({behavior:'smooth',block:'center'}),80);
}
function beginBatch(){
 const gen=String($('#gen').value||'').trim(); if(!gen){alert('Selecciona o escribe una genética.');return;} rememberGenetic(gen); DATA.genetics=gen;
 DATA.initialTrim=parseFloat(String($('#initial').value||'').replace(',','.'))||0;
 DATA.trimQuality=parseFloat($('#trimRating').dataset.value)||4;
 const mode=$('.seg.on')?.dataset?.count||'2';
 if(mode==='other') plannedTumbles=Math.max(2,parseInt($('#otherTumbles').value)||2); else plannedTumbles=parseInt(mode)||2;
 tumbleCount=plannedTumbles;
 if(DATA.initialTrim<=0){alert('Introduce el peso inicial del trim.');return;}
 tumble(1);
}

}

function geneticTyping(value){
 const q=String(value||'').trim();
 const clear=$('#genClear'); if(clear)clear.style.display=q?'block':'none';
 renderGenSuggestions(q);
 if(q.length>=2 && q.length<=4) requestSeedFinder(q.charAt(0).toUpperCase());
}
function clearGeneticInput(){
 const input=$('#gen'); if(!input)return; input.value=''; input.dataset.selected=''; DATA.genetics='';
 const clear=$('#genClear'); if(clear)clear.style.display='none';
 const selected=$('#selectedGenetic'); if(selected)selected.classList.add('hidden');
 renderGenSuggestions(''); input.focus();
}
function renderQuickGenetics(){
 const box=$('#genQuick'); if(!box)return;
 const picks=['Blue Nerd','Papaya Drip','Moroccan Peaches','Zangria','Oreoz','Blue Magic','Starbust','24K','Grape Gas','Honey Banana','Tidebanger','Tropicanna Cherry','Tropaya'];
 box.innerHTML=picks.filter(g=>allGenetics().some(x=>x.toLowerCase()===g.toLowerCase())).map(g=>`<button type="button" class="genetic-chip" data-gen="${encodeURIComponent(g)}" onclick="chooseGen(decodeURIComponent(this.dataset.gen))">${geneticIcon(g)} ${g}</button>`).join('');

let tumbleCount=2;
let plannedTumbles=2;
let actualTumbles=0;
function setT(n){
 document.querySelectorAll('.seg').forEach(x=>x.classList.toggle('on',x.dataset.count===String(n)));
 const box=$('#otherTumbleBox'); if(box)box.classList.toggle('hidden',n!=='other');
}
function timePicker(n,current){
 const presets=TIME_PRESETS.map(t=>`<button type="button" class="preset ${current===t?'on':''}" onclick="setTimePreset(${t})">${t} min</button>`).join('');
 return `<div class="preset-row">${presets}<button type="button" class="preset ${TIME_PRESETS.includes(current)?'':'on'}" onclick="setTimePreset('other')">Otro</button></div><div id="otherTimeBox" class="other-box ${TIME_PRESETS.includes(current)?'hidden':''}"><input id="otherTime" type="number" min="1" max="20" inputmode="numeric" value="${current}" placeholder="1–20 min"></div>`;
}
let selectedTime=3;
function setTimePreset(v){
 if(v==='other'){
   const box=$('#otherTimeBox'); if(box)box.classList.remove('hidden');
   document.querySelectorAll('.preset').forEach(x=>x.classList.remove('on'));
   const other=document.querySelectorAll('.preset')[4]; if(other)other.classList.add('on');
   selectedTime=parseInt($('#otherTime')?.value)||3;
 }else{
   selectedTime=v; document.querySelectorAll('.preset').forEach(x=>x.classList.toggle('on',x.textContent.trim()===v+' min'));
   const box=$('#otherTimeBox'); if(box)box.classList.add('hidden');
 }
}
function tumble(n){
 const defaults=[3,5,7,10];
 const d=DATA.tumbles[n-1]||{time:defaults[n-1]||10,rpm:25,kief:0}; selectedTime=d.time;
 const next=`<button class="primary-btn" onclick="saveTumble(${n});tumble(${n+1})">Tambleada #${n+1}&nbsp; →</button>`;
 const finish=`<button class="secondary-btn" onclick="saveTumble(${n});result()">Finalizar Batch&nbsp; ✓</button>`;
 const controls = n===1 ? next : finish+next;
 $("#app").innerHTML=frame("Tambleada #"+n,`
 <label>Tiempo de tambleo</label>${timePicker(n,d.time)}
 <div class="gen-note">Predeterminados: 3 · 5 · 7 · 10 min. El valor personalizado debe estar entre 1 y 20 min.</div>
 <label>Velocidad de tambleo</label><div class="rpm-wrap"><div class="rpm-head"><span>0 RPM</span><span class="rpm-value" id="rpmValue">${Math.max(0,Math.min(45,d.rpm))} RPM</span></div><input id="rpm" class="rpm-slider" type="range" min="0" max="45" step="1" value="${Math.max(0,Math.min(45,d.rpm))}" oninput="updateRPM(this.value)"><div class="rpm-scale"><span>0</span><span>15</span><span>30</span><span>45 RPM</span></div></div>
 <label>Peso de kief obtenido (g)</label><input id="kief" type="number" min="0" step="0.1" inputmode="decimal" value="${d.kief}" placeholder="0 g">
 <div class="tumble-actions">${controls}</div>
 <div class="gen-note">Plan seleccionado: ${plannedTumbles} tambleadas. Puedes finalizar después de la #2 o continuar con #3, #4 y siguientes.</div>`);
}
function updateRPM(value){
 let v=Math.max(0,Math.min(45,parseInt(value)||0));
 if(v===14||v===16)v=15;
 if(v===29||v===31)v=30;
 const el=$("#rpm"); if(el)el.value=v;
 const out=$("#rpmValue"); if(out)out.textContent=v+' RPM';
}
function saveTumble(n){
 let time=selectedTime;
 const other=$('#otherTime'); if(other && !$('#otherTimeBox')?.classList.contains('hidden')) time=Math.max(1,Math.min(20,parseInt(other.value)||selectedTime));
 const rpm=parseInt($("#rpm").value)||0,kief=parseFloat($("#kief").value)||0;
 DATA.tumbles[n-1]={time,rpm,kief}; actualTumbles=Math.max(actualTumbles,n);
}

function validateBatch(){
 const ts=DATA.tumbles.slice(0,actualTumbles||tumbleCount);
 if(!DATA.genetics){alert('Selecciona una genética.');return false;}
 if(!(DATA.initialTrim>0)){alert('Introduce el peso inicial del trim.');return false;}
 if(!ts.length){alert('Registra al menos una tambleada.');return false;}
 return true;
}
function result(){
 const ts=DATA.tumbles.slice(0,actualTumbles||tumbleCount);
 const total=ts.reduce((a,x)=>a+(Number(x.kief)||0),0);
 const trim=Number(DATA.initialTrim)||0; const yieldPct=trim?total/trim*100:0; const leftover=Math.max(0,trim-total);
 DATA.leftover=leftover;
 if(!Number.isFinite(DATA.kiefQuality)||DATA.kiefQuality<0.5) DATA.kiefQuality=4;
 const rating=interactiveRating('kiefRating',DATA.kiefQuality);
 $("#app").innerHTML=frame("Resultado del Batch",`
 <div class="result-title">✓<br>Resultado del Batch</div>
 <div class="result-box">
  <div class="rline"><span>Genética:</span><strong>${escapeHtml(DATA.genetics)}</strong></div>
  <div class="rline"><span>Calidad trim:</span><strong>${stars(DATA.trimQuality)} &nbsp;(${DATA.trimQuality}/5)</strong></div>
  <div class="rline"><span>Peso inicial:</span><strong>${trim.toLocaleString('es-ES')} g</strong></div>
 </div>
 <div class="card" style="margin-top:12px"><table class="table"><thead><tr><th>Tambleada</th><th>Tiempo</th><th>RPM</th><th>Kief</th></tr></thead><tbody>
 ${ts.map((x,i)=>`<tr><td>#${i+1}</td><td>${x.time} min</td><td>${x.rpm} RPM</td><td>${Number(x.kief).toFixed(1)} g</td></tr>`).join('')}</tbody></table>
 <div class="rline" style="margin-top:7px"><span>Kief total obtenido</span><strong style="font-size:22px">${total.toFixed(1)} g</strong></div>
 <div class="rline"><span>Biomasa sobrante</span><strong>${leftover.toFixed(1)} g</strong></div></div>
 <label>Calidad del kief</label>${rating}
 <div class="bigmetric"><div>Rendimiento total</div><div class="v">${yieldPct.toFixed(2)} %</div></div>
 <div class="result-actions"><button class="primary-btn" onclick="saveBatch()">Guardar Batch&nbsp; ✓</button><button class="secondary-btn" onclick="sendBatchEmail()">✉ Enviar info del Batch al email</button></div>`);
 setRating('kiefRating',DATA.kiefQuality);
}
function getSavedBatches(){ try { const a=JSON.parse(localStorage.getItem('tt_batches')||'[]'); return Array.isArray(a)?a:[]; } catch(e){ return []; } }
function persistBatches(saved){ try{localStorage.setItem('tt_batches',JSON.stringify(Array.isArray(saved)?saved:[]));}catch(e){alert('No se pudo guardar el batch en este dispositivo.');} }
function makeBatchId(){ return Date.now()+Math.floor(Math.random()*1000); }
function saveBatch(){
 if(!validateBatch()) return;
 const ts=DATA.tumbles.slice(0,actualTumbles||tumbleCount).map(x=>({time:Number(x.time)||0,rpm:Number(x.rpm)||0,kief:Number(x.kief)||0}));
 const total=ts.reduce((a,x)=>a+x.kief,0), trim=Number(DATA.initialTrim)||0;
 const batch={id:makeBatchId(),date:new Date().toISOString(),genetics:DATA.genetics,trimQuality:Number(DATA.trimQuality)||4,initialTrim:trim,tumbles:ts,kiefTotal:total,kiefQuality:Number(DATA.kiefQuality)||4,biomass:Math.max(0,trim-total),yield:trim?total/trim*100:0};
 const arr=getSavedBatches().filter(x=>x.id!==batch.id); arr.unshift(batch); persistBatches(arr); rememberGenetic(batch.genetics);
 alert('Batch guardado correctamente.');
 batches();
}

function batches(){
 const saved=getSavedBatches();
 if(!saved.length){
  $("#app").innerHTML=frame("Batches",`<div class="card"><div class="ghead">Todavía no hay batches guardados</div><p class="muted" style="line-height:1.5">Cuando pulses “Guardar Batch”, aparecerá aquí organizado por día y después por genética.</p><button class="primary-btn" onclick="newBatch()">Nuevo Batch&nbsp; →</button></div>`,'home',true); return;
 }
 const days={};
 saved.forEach(b=>{ const d=new Date(b.date); const key=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'); if(!days[key])days[key]={date:d,batches:[]}; days[key].batches.push(b); });
 const html=Object.keys(days).sort((a,b)=>b.localeCompare(a)).map(key=>{
  const day=days[key], byGen={}; day.batches.forEach(b=>(byGen[b.genetics] ||= []).push(b));
  return `<div class="batch-day">${day.date.toLocaleDateString('es-ES',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</div>` + Object.keys(byGen).sort((a,b)=>a.localeCompare(b,'es')).map(gen=>`<div class="batch-gen">${gen} <span style="float:right;color:#8f949c;font-size:12px;font-weight:600">${byGen[gen].length} batch${byGen[gen].length===1?'':'es'}</span></div>${byGen[gen].sort((a,b)=>b.id-a.id).map(b=>`<div class="card batch-card" onclick="batchDetail(${b.id})"><div class="ghead">Batch #${String(b.id).slice(-5)}</div><div class="batch-meta"><span>Trim</span><b>${Number(b.initialTrim).toLocaleString('es-ES')} g</b></div><div class="batch-meta"><span>Kief total</span><b>${Number(b.kiefTotal).toFixed(1)} g</b></div><div class="batch-meta"><span>Rendimiento</span><b class="gold">${Number(b.yield).toFixed(2).replace('.',',')} %</b></div><div class="batch-meta"><span>Calidad trim</span><b>${stars(Number(b.trimQuality))} ${Number(b.trimQuality).toFixed(1).replace('.0','')}/5</b></div></div>`).join('')}`).join('');
 }).join('');
 $("#app").innerHTML=frame("Batches",html,'home',true);
}
function batchDetail(id){
 const saved=getSavedBatches(); const b=saved.find(x=>Number(x.id)===Number(id)); if(!b){batches();return;}
 const d=new Date(b.date), ts=b.tumbles||[];
 $("#app").innerHTML=frame("Batch #"+String(b.id).slice(-5),`<div class="detail-title">${b.genetics}</div><div class="detail-date">${d.toLocaleString('es-ES')}</div><div class="result-box"><div class="rline"><span>Calidad del trim</span><strong>${stars(Number(b.trimQuality))} ${Number(b.trimQuality).toFixed(1).replace('.0','')}/5</strong></div><div class="rline"><span>Peso inicial del trim</span><strong>${Number(b.initialTrim).toLocaleString('es-ES')} g</strong></div></div><div class="card" style="margin-top:12px"><table class="table"><thead><tr><th>Tambleada</th><th>Tiempo</th><th>RPM</th><th>Kief</th></tr></thead><tbody>${ts.map((x,i)=>`<tr><td>#${i+1}</td><td>${x.time} min</td><td>${x.rpm}</td><td>${Number(x.kief).toFixed(1)} g</td></tr>`).join('')}</tbody></table><div class="rline" style="margin-top:8px"><span>Kief total obtenido</span><strong>${Number(b.kiefTotal).toFixed(1)} g</strong></div><div class="rline"><span>Calidad del kief</span><strong>${stars(Number(b.kiefQuality))} ${Number(b.kiefQuality).toFixed(1).replace('.0','')}/5</strong></div><div class="rline"><span>Biomasa sobrante</span><strong>${Number(b.biomass).toFixed(1)} g</strong></div></div><div class="bigmetric"><div>Rendimiento total</div><div class="v">${Number(b.yield).toFixed(2)} %</div></div><div class="result-actions"><button class="primary-btn" onclick="sendSavedBatchEmail(${b.id})">✉ Enviar email</button><button class="secondary-btn back-soft" onclick="batches()">← Volver a Batches</button></div>`);
}
function sendSavedBatchEmail(id){
 const saved=getSavedBatches(); const b=saved.find(x=>Number(x.id)===Number(id)); if(!b)return;
 const ts=b.tumbles||[], total=Number(b.kiefTotal)||ts.reduce((a,x)=>a+(Number(x.kief)||0),0), trim=Number(b.initialTrim)||0, yieldPct=Number(b.yield)|| (trim?total/trim*100:0);
 const d=new Date(b.date);
 const lines=['TUMBLER TRACKER — DETALLE DEL BATCH','', 'Batch #'+String(b.id).slice(-5), 'Fecha: '+d.toLocaleString('es-ES'), 'Genética: '+b.genetics, 'Calidad del trim: '+b.trimQuality+'/5', 'Peso inicial del trim: '+trim.toFixed(1)+' g', 'Nº de tambleadas: '+ts.length, '', ...ts.map((x,i)=>'Tambleada #'+(i+1)+': Tiempo '+x.time+' min | RPM '+x.rpm+' | Kief '+x.kief+' g'), '', 'Kief total obtenido: '+total.toFixed(1)+' g', 'Calidad del kief: '+b.kiefQuality+'/5', 'Biomasa sobrante: '+Number(b.biomass||0).toFixed(1)+' g', 'Rendimiento total: '+yieldPct.toFixed(2)+' %'];
 const subject=encodeURIComponent('Tumbler Tracker — Batch #'+String(b.id).slice(-5)+' — '+b.genetics); const body=encodeURIComponent(lines.join('\n'));
 nativeEmail(decodeURIComponent(subject),decodeURIComponent(body));
}
function analysis(mode='genetics'){
 const saved=getSavedBatches();
 const modes={genetics:'Genética',quality:'Calidad',tumbles:'Tambleadas'};
 let body=`<div class="tabs"><button class="tab ${mode==='genetics'?'on':''}" onclick="analysis('genetics')">Genética</button><button class="tab ${mode==='quality'?'on':''}" onclick="analysis('quality')">Calidad</button><button class="tab ${mode==='tumbles'?'on':''}" onclick="analysis('tumbles')">Tambleadas</button></div>`;
 if(!saved.length){ body+=`<div class="card empty"><div style="font-size:32px">▥</div><div class="ghead" style="margin-top:8px">Aún no hay datos para analizar</div><p>Guarda tu primer batch y esta sección se actualizará automáticamente.</p><button class="primary-btn" onclick="newBatch()">Nuevo Batch →</button></div>`; $("#app").innerHTML=frame('Análisis',body,'home',true); return; }
 if(mode==='genetics'){
  const map={}; saved.forEach(b=>{const g=b.genetics||'Sin genética';const m=map[g]||(map[g]={batches:0,trim:0,kief:0,yields:[],quality:[]});m.batches++;m.trim+=Number(b.initialTrim)||0;m.kief+=Number(b.kiefTotal)||0;m.yields.push(Number(b.yield)||0);m.quality.push(Number(b.kiefQuality)||0);});
  const rows=Object.keys(map).sort((a,b)=>a.localeCompare(b,'es')).map(g=>{const m=map[g],avg=m.yields.reduce((a,x)=>a+x,0)/m.yields.length,q=m.quality.reduce((a,x)=>a+x,0)/m.quality.length;return `<div class="card"><div class="ghead">♨ ${g}</div><div class="gstat"><span>Batches</span><b>${m.batches}</b></div><div class="gstat"><span>Trim procesado</span><b>${m.trim.toLocaleString('es-ES')} g</b></div><div class="gstat"><span>Kief obtenido</span><b>${m.kief.toFixed(1)} g</b></div><div class="gstat"><span>Rendimiento medio</span><b class="gold">${avg.toFixed(2).replace('.',',')} %</b></div><div class="gstat"><span>Calidad media kief</span><b>${q.toFixed(1).replace('.',',')} / 5</b></div></div>`}).join('');
  body+=rows;
 } else if(mode==='quality'){
  const tq=saved.reduce((a,b)=>a+(Number(b.trimQuality)||0),0)/saved.length; const kq=saved.reduce((a,b)=>a+(Number(b.kiefQuality)||0),0)/saved.length;
  const byQ=[1,2,3,4,5].map(q=>saved.filter(b=>Math.round(Number(b.kiefQuality)||0)===q).length);
  body+=`<div class="metric-grid"><div class="metric-card"><div class="cap">Calidad media trim</div><div class="num">${tq.toFixed(1)}/5</div></div><div class="metric-card"><div class="cap">Calidad media kief</div><div class="num">${kq.toFixed(1)}/5</div></div></div><div class="card"><div class="ghead">Distribución de calidad del kief</div>${byQ.map((n,i)=>`<div class="gstat"><span>${i+1}/5</span><b>${n}</b></div><div class="progress"><i style="width:${Math.min(100,n/saved.length*100)}%"></i></div>`).join('')}</div>`;
 } else {
  const all=saved.flatMap(b=>b.tumbles||[]); const avgTime=all.length?all.reduce((a,x)=>a+(Number(x.time)||0),0)/all.length:0; const avgRPM=all.length?all.reduce((a,x)=>a+(Number(x.rpm)||0),0)/all.length:0; const avgKief=all.length?all.reduce((a,x)=>a+(Number(x.kief)||0),0)/all.length:0;
  body+=`<div class="metric-grid"><div class="metric-card"><div class="cap">Tambleadas</div><div class="num">${all.length}</div></div><div class="metric-card"><div class="cap">Media tiempo</div><div class="num">${avgTime.toFixed(1)} min</div></div><div class="metric-card"><div class="cap">Media RPM</div><div class="num">${avgRPM.toFixed(1)}</div></div><div class="metric-card"><div class="cap">Media kief</div><div class="num">${avgKief.toFixed(1)} g</div></div></div>`;
 }
 $("#app").innerHTML=frame('Análisis',body,'home',true);
}
function statistics(){
 const saved=getSavedBatches();
 const totalTrim=saved.reduce((a,b)=>a+(Number(b.initialTrim)||0),0);
 const totalKief=saved.reduce((a,b)=>a+(Number(b.kiefTotal)||0),0);
 const avgYield=saved.length?saved.reduce((a,b)=>a+(Number(b.yield)||0),0)/saved.length:0;
 const best=saved.slice().sort((a,b)=>(Number(b.yield)||0)-(Number(a.yield)||0))[0];
 const geneticCount=new Set(saved.map(b=>b.genetics).filter(Boolean)).size;
 const last=saved.slice().sort((a,b)=>Number(b.id)-Number(a.id))[0];
 let body=`<div class="metric-grid"><div class="metric-card"><div class="cap">Batches</div><div class="num">${saved.length}</div></div><div class="metric-card"><div class="cap">Genéticas usadas</div><div class="num">${geneticCount}</div></div><div class="metric-card"><div class="cap">Trim total</div><div class="num">${totalTrim.toLocaleString('es-ES')} g</div></div><div class="metric-card"><div class="cap">Kief total</div><div class="num">${totalKief.toFixed(1)} g</div></div></div>`;
 if(saved.length){body+=`<div class="card"><div class="ghead">Resumen de rendimiento</div><div class="gstat"><span>Rendimiento medio</span><b class="gold">${avgYield.toFixed(2).replace('.',',')} %</b></div><div class="gstat"><span>Mejor batch</span><b>#${String(best.id).slice(-5)} · ${Number(best.yield).toFixed(2)} %</b></div><div class="gstat"><span>Último batch</span><b>${best===last?'El último es también el mejor':'#'+String(last.id).slice(-5)}</b></div></div>`;}
 else {body+=`<div class="card empty"><div style="font-size:32px">◔</div><div class="ghead" style="margin-top:8px">Sin estadísticas todavía</div><p>Las métricas aparecerán aquí al guardar batches.</p><button class="primary-btn" onclick="newBatch()">Crear primer Batch →</button></div>`;}
 body+=`<button class="section-btn" type="button" onclick="analysis('genetics')">▥ Abrir análisis<small>Compara genética, calidad y tambleadas.</small></button>`;
 $("#app").innerHTML=frame('Estadísticas',body,'home',true);
}
function genetics(){
 const list=allGenetics();
 $("#app").innerHTML=frame("Genéticas",`
 <div class="gen-sync"><div><b>Catálogo de genéticas</b><div class="status" id="genSyncStatus">${list.length} nombres disponibles</div></div><button class="secondary-btn" type="button" onclick="requestSeedFinderSync()">Actualizar</button></div>
 <div class="gen-add"><input id="futureGen" autocomplete="off" placeholder="Añadir genética futura…"><button class="primary-btn" style="width:auto;margin:0" type="button" onclick="addFutureGenetic()">＋ Añadir</button></div>
 <div class="gen-search-wrap"><input id="genCatalogSearch" autocomplete="off" placeholder="Buscar genética…" oninput="renderGenCatalog(this.value)"></div>
 <div id="genCatalog" class="gen-catalog">${renderGenCatalogHtml(list)}</div>
 `,"home",true);
}
function renderGenCatalogHtml(list){return list.map(g=>`<button class="gen-catalog-row" type="button" data-gen="${encodeURIComponent(g)}" onclick="useGeneticFromCatalog(decodeURIComponent(this.dataset.gen))"><span class="gen-icon">${geneticIcon(g)}</span><span class="gen-meta"><b>${escapeHtml(g)}</b><span class="gen-source">Disponible para procesar / ya registrada</span></span><span class="chev">›</span></button>`).join('')||'<div class="card"><div class="muted">No hay genéticas todavía.</div></div>';}
function renderGenCatalog(query=''){const box=$('#genCatalog');if(!box)return;const q=String(query||'').toLowerCase().trim();box.innerHTML=renderGenCatalogHtml(allGenetics().filter(g=>!q||g.toLowerCase().includes(q)));}
function addFutureGenetic(){const input=$('#futureGen');if(!input)return;const name=String(input.value||'').trim();if(!name){input.focus();return;}rememberGenetic(name);input.value='';genetics();}
function useGeneticFromCatalog(name){rememberGenetic(name);newBatch();setTimeout(()=>chooseGen(name),60);}
function settings(){
 $("#app").innerHTML=frame("Ajustes",`
 <div class="card"><div class="ghead">Email de informes</div><div class="gstat"><span>Destino</span><b>docalc8@gmail.com</b></div><button class="primary-btn" onclick="emailNow()">✉ Enviar resumen diario</button><small class="muted" style="display:block;margin-top:10px;line-height:1.4">El botón abre el correo nativo de iOS con la información preparada para revisar y enviar.</small></div>
 <div class="card"><div class="ghead">Navegación</div><button class="section-btn" type="button" onclick="dashboard()">⌂ Ir al inicio<small>Volver al panel principal.</small></button><button class="section-btn" type="button" onclick="genetics()">⌘ Gestionar genéticas<small>Buscar y seleccionar genéticas del catálogo.</small></button></div>
 `,'home',true);
}
function emailNow(){
 const subject=encodeURIComponent("Tumbler Tracker — resumen diario");
 const body=encodeURIComponent("Tumbler Tracker\\n\\nBatch #001 — GMO\\nTrim: 12.500 g\\nKief: 496 g\\nRendimiento: 3,96 %\\nCalidad kief: 4/5\\n\\nTambleadas: 18 min / 25 RPM / 285 g; 16 min / 25 RPM / 162 g; 12 min / 25 RPM / 48 g");
 nativeEmail(decodeURIComponent(subject),decodeURIComponent(body));
}
home();
</script>
